    <!-- اعمال تم پیش از رندر (جلوگیری از پرش رنگ در اولین بارگذاری) -->
    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem('vue3-workshop-theme')
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          var isDark = stored === 'dark' || (stored !== 'light' && prefersDark)
          if (isDark) document.documentElement.classList.add('dark')
        } catch (error) {
          /* در محیط‌های محدود (مثلاً حالت private) به تم روشن برمی‌گردیم */
        }
      })()
    </script>
